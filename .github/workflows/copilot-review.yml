# ==============================================================================
# CANONICAL FLEET WORKFLOW - Request Copilot review
# Install at: .github/workflows/copilot-review.yml
# ==============================================================================
#
# THE 422 PROBLEM, stated here in full (the workflow that used to carry this
# explanation, coderabbit-trigger.yml, is REMOVED fleet-wide): a 422 from
# pulls.requestReviewers can mean two opposite things - the reviewer is
# already requested (benign) OR the reviewer is invalid/absent (total
# failure). The old fleet code treated both as benign
# (`if (status === 422) core.warning('benign')`), which turned the failure
# case into a permanent silent no-review. This workflow requests the review,
# then VERIFIES the reviewer is attached at the CURRENT head, and fails
# loudly otherwise.
#
# THIS FILE MATTERS MORE THAN THE CODERABBIT ONE, for one reason: unlike
# CodeRabbit, Copilot has NO auto_review config. There is no `.copilot.yaml`
# that subscribes Copilot to PR events. The reviewer request IS the only path.
# So when this workflow silently no-ops, Copilot reviews nothing, forever.
#
# The fleet audit found exactly that: the `GitHub` repo requests the slug
# `copilot` and Travis-construction-assistant requests `copilot` too, while
# the rest of the fleet uses `copilot-pull-request-reviewer[bot]`. At most one
# of those is right. The wrong one 422s on every single PR, and the old catch
# block guaranteed nobody would ever find out.
#
# The verification step below turns that permanent silent no-op into a loud
# red job on the first PR after adoption. Expect failures on adoption in repos
# with a wrong slug. That is the fix working, not the fix breaking.
# ==============================================================================

name: Request Copilot Review

on:
  pull_request:
    # `labeled` REMOVED: unrelated-label events were creating skipped runs
    # that mask failures, and cancel-in-progress races that killed live
    # requests. `synchronize` ADDED: every new head is re-requested and
    # re-verified, which the current-head check below requires to be
    # meaningful.
    types: [opened, synchronize, reopened, ready_for_review]
  # Manual re-runs (e.g. after fixing the org's Copilot settings or the slug).
  workflow_dispatch:

concurrency:
  group: request-copilot-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  request-copilot:
    name: Request and verify Copilot reviewer
    runs-on: ubuntu-latest

    permissions:
      pull-requests: write # pulls.requestReviewers

    # dependabot[bot] excluded: dependabot-triggered runs get a read-only
    # GITHUB_TOKEN regardless of requested permissions, so requestReviewers
    # can only 403; dependabot PRs are covered by CodeRabbit auto-review
    # instead (see .coderabbit.yaml). workflow_dispatch carries no
    # pull_request payload, so it takes the first branch here and the script
    # below exits cleanly instead.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]')

    steps:
      - name: Request Copilot and verify it is attached
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          # The slug GitHub documents for requesting the Copilot code reviewer.
          # If this ever 422s fleet-wide, the slug changed - fix it HERE, in
          # the template, and re-sync. Do not patch individual repos.
          TARGET_REVIEWER: copilot-pull-request-reviewer[bot]
          # Copilot reads back under several logins depending on endpoint and
          # account age. All accepted forms listed; matching is case-insensitive
          # and [bot]-suffix insensitive.
          TARGET_ALIASES: copilot-pull-request-reviewer[bot],copilot-pull-request-reviewer,copilot
        with:
          script: |
            if (!context.payload.pull_request) {
              core.notice('workflow_dispatch without PR context - use the Actions UI on a PR branch or re-run a failed PR run');
              return;
            }

            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request.number;

            const target = process.env.TARGET_REVIEWER;
            const aliases = new Set(
              process.env.TARGET_ALIASES
                .split(',')
                .map(s => s.trim().toLowerCase())
                .filter(Boolean)
            );

            const norm = (login) => (login || '').trim().toLowerCase();
            const matches = (login) => {
              const l = norm(login);
              return aliases.has(l) || aliases.has(l.replace(/\[bot\]$/, ''));
            };

            async function reviewerIsAttached() {
              const requested = await github.rest.pulls.listRequestedReviewers({
                owner, repo, pull_number: prNumber,
              });
              const requestedUsers = requested.data.users || [];
              if (requestedUsers.some(u => matches(u.login))) {
                return { attached: true, how: 'listed as a requested reviewer' };
              }

              const reviews = await github.paginate(
                github.rest.pulls.listReviews,
                { owner, repo, pull_number: prNumber, per_page: 100 }
              );
              // Only a review of the CURRENT head counts. A historical review
              // of an earlier push proves nothing about this diff, and
              // accepting it would recreate the false-green this workflow
              // exists to kill (raised by Codex on the rollout PRs).
              const headSha = context.payload.pull_request.head.sha;
              if (reviews.some(r => matches(r.user && r.user.login) && r.commit_id === headSha)) {
                return { attached: true, how: 'has already reviewed the current head' };
              }

              return {
                attached: false,
                requested: requestedUsers.map(u => u.login),
                reviewed: [...new Set(reviews.map(r => r.user && r.user.login).filter(Boolean))],
              };
            }

            let requestError = null;
            try {
              await github.rest.pulls.requestReviewers({
                owner, repo, pull_number: prNumber, reviewers: [target],
              });
              core.info(`requestReviewers accepted for "${target}".`);
            } catch (e) {
              const status = e.status ?? e.response?.status;
              const msg = e.response?.data?.message ?? e.message;
              requestError = { status, msg };

              if (status !== 422) {
                core.setFailed(
                  `requestReviewers failed for "${target}" with status ${status ?? 'unknown'}: ${msg}`
                );
                throw e;
              }

              core.info(
                `requestReviewers returned 422 for "${target}" (${msg}). ` +
                `Verifying whether the reviewer is already attached...`
              );
            }

            const state = await reviewerIsAttached();

            if (state.attached) {
              if (requestError) {
                core.info(
                  `422 confirmed benign: "${target}" ${state.how}. ` +
                  `Original message: ${requestError.msg}`
                );
              } else {
                core.info(`Verified: "${target}" ${state.how}.`);
              }
              await core.summary
                .addHeading('Copilot reviewer verified', 3)
                .addRaw(`\`${target}\` is attached to PR #${prNumber} (${state.how}).`)
                .write();
              return;
            }

            const detail = [
              `Requested reviewers on PR #${prNumber}: ${state.requested.length ? state.requested.join(', ') : '(none)'}`,
              `Reviews submitted by: ${state.reviewed.length ? state.reviewed.join(', ') : '(none)'}`,
              requestError
                ? `requestReviewers returned ${requestError.status}: ${requestError.msg}`
                : `requestReviewers returned success but the reviewer is not present.`,
              '',
              'Likely causes, in order of probability:',
              `  1. Copilot code review is not enabled for ${owner} (org/plan setting).`,
              `  2. The reviewer slug "${target}" is wrong - the fleet currently`,
              '     disagrees between "copilot" and "copilot-pull-request-reviewer[bot]".',
              '  3. Copilot lost access to this repository.',
              '',
              'Copilot has no auto-review config, so this request is the ONLY',
              'path to a Copilot review. A silent pass here means no review at all.',
            ].join('\n');

            core.setFailed(
              `Could not verify that "${target}" is a reviewer on PR #${prNumber}.\n${detail}`
            );
