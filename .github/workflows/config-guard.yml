# ==============================================================================
# CANONICAL FLEET WORKFLOW - config-guard
# Install at: .github/workflows/config-guard.yml
# ==============================================================================
#
# WHY THIS EXISTS
# On 2026-08-01 a "cost control" sweep deleted the CodeRabbit and Copilot
# review automation from most active repos in the fleet, in one morning, and
# nothing tripped: no check failed, no gate fired, the deletions merged like
# ordinary work and the absence was invisible afterwards. Calum's directive
# the same day, verbatim intent: bots back on, "we need more security, not
# less", and stop anyone touching the review config without his word.
#
# WHAT IT DOES
# Fails any PR that adds, edits, renames, or deletes a protected review-config
# path, unless the PR carries the `config-change-approved` label. The label is
# the sanctioned escape hatch: the standard itself must remain updatable, and
# a gate with no exit just gets deleted (which is exactly what this gate is
# for). Label additions are recorded in the PR timeline with the actor, so
# every use is auditable after the fact. Policy, not this file, says who may
# add it: Calum's word, nobody else's.
#
# TRUST MODEL, STATED PLAINLY
# This workflow runs on `pull_request_target`, so the definition that executes
# comes from the TRUSTED BASE BRANCH, not from the PR. That closes the
# self-rewrite bypass the old `pull_request` trigger left open: a PR editing
# config-guard.yml can no longer substitute a no-op guard for the very run
# that judges it.
#
# THE LOAD-BEARING SAFETY INVARIANT: this job must NEVER check out or execute
# PR-controlled code - it only reads PR metadata via the API. That invariant
# is what makes pull_request_target safe here; any future edit that adds a
# checkout step to this workflow is a security bug.
#
# `edited` is in the trigger types so retargeting the PR base re-evaluates
# the diff. Known gap, expected: on rollout PRs that ADD this file the guard
# does not run (there is no definition on the base branch yet) - the
# protection begins after the first merge.
#
# The label escape remains friction plus visibility, not a hard lock: anyone
# with write access CAN add it. The hard lock is layered on top by a
# repository ruleset that requires this check to pass on the default branch.
# ==============================================================================

name: config-guard

on:
  # pull_request_target: the workflow definition executes from the trusted
  # base branch - see TRUST MODEL in the header. `edited` is included so
  # retargeting the PR base re-evaluates the diff.
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]

concurrency:
  group: config-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  guard:
    name: Protect review-config paths
    runs-on: ubuntu-latest

    permissions:
      pull-requests: read # pulls.listFiles
      issues: read # issues.listLabelsOnIssue (PR labels live on the issue)

    # No fork skip, deliberately. This job only READS (listFiles + a live
    # label read), which a fork PR's read-only token fully supports, and a skipped
    # job satisfies a required-check ruleset - so skipping forks would hand
    # fork PRs a free bypass of exactly this guard. Raised by CodeRabbit on
    # the rollout PRs. The label escape stays safe for forks on its own:
    # adding a label requires write access on the BASE repo.

    steps:
      - name: Check protected paths
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          APPROVAL_LABEL: config-change-approved
        with:
          script: |
            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request.number;
            const label = process.env.APPROVAL_LABEL;

            const PROTECTED = new Set([
              '.coderabbit.yaml',
              // Legacy config location. CodeRabbit prefers the root copy when
              // both exist, but in a repo missing the root copy this file IS
              // the resolved policy - it must never be (re)introduced or
              // edited silently.
              '.github/coderabbit.yaml',
              // Steers Copilot's review behavior where present.
              '.github/copilot-instructions.md',
              '.github/workflows/claude-review.yml',
              // Removed from the standard 2026-08-01 (requestReviewers cannot
              // attach the CodeRabbit app), kept protected so stray copies
              // cannot be edited or reintroduced silently.
              '.github/workflows/coderabbit-trigger.yml',
              '.github/workflows/copilot-review.yml',
              '.github/workflows/config-guard.yml',
            ]);

            // Page through every changed file. `filename` is the current path;
            // `previous_filename` is set on renames - a rename OUT of a
            // protected path must count, or "rename then delete next PR"
            // becomes a two-step bypass.
            const files = await github.paginate(
              github.rest.pulls.listFiles,
              { owner, repo, pull_number: prNumber, per_page: 100 }
            );

            // listFiles caps at 3000 files. A truncated list cannot prove the
            // protected paths are untouched, so fail closed rather than pass
            // on incomplete evidence.
            const expected = context.payload.pull_request.changed_files;
            if (typeof expected === 'number' && files.length < expected) {
              core.setFailed(
                `File list truncated: received ${files.length} of ${expected} changed files. ` +
                'The guard cannot prove protected paths are untouched. Split this PR.'
              );
              return;
            }

            const touched = files.filter(f =>
              PROTECTED.has(f.filename) ||
              (f.previous_filename && PROTECTED.has(f.previous_filename))
            );

            if (touched.length === 0) {
              core.info('No protected review-config paths touched. Pass.');
              return;
            }

            const detail = touched
              .map(f => `  ${f.status}: ${f.previous_filename ? f.previous_filename + ' -> ' : ''}${f.filename}`)
              .join('\n');

            // Payload labels can be stale relative to rapid label add/remove
            // races; the live read decides.
            const liveLabels = await github.paginate(
              github.rest.issues.listLabelsOnIssue,
              { owner, repo, issue_number: prNumber, per_page: 100 }
            );
            const labels = liveLabels.map(l => (l.name || '').toLowerCase());

            if (labels.includes(label.toLowerCase())) {
              core.warning(
                `Protected review-config paths modified WITH the "${label}" label:\n${detail}\n` +
                'The label add is in the PR timeline - auditable. Proceeding.'
              );
              return;
            }

            core.setFailed(
              `This PR touches protected review-config paths without the "${label}" label:\n${detail}\n\n` +
              'These files gate the fleet review chain. On 2026-08-01 a sweep deleted them ' +
              'fleet-wide and nothing tripped; this check is what now trips. Changes require ' +
              `Calum's word - the sanctioned path is him authorising the "${label}" label on this PR. ` +
              'Do not treat this PR as mergeable until this check passes.'
            );
